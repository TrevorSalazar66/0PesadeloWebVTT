name = "0PesadeloWebVTT"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Configuração do Banco Relacional Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "arcana_vtt_db"
database_id = "local-arcana-vtt-d1"

# Variáveis e Segredos de Ambiente
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:5500,http://127.0.0.1:5500,https://arcana.pages.dev"
JWT_SECRET = "arcana-super-secret-key-development-local-2026-vtt"
